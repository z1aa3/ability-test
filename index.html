<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Ability Assessment</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #333;
            background-image: url('samak.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .card {
            width: 90%; max-width: 450px;
            padding: 40px 15px; text-align: center; position: relative;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            box-sizing: border-box;
        }

        .hidden { display: none; }

        .char-container { width: 150px; margin: 0 auto 20px; animation: floating 3s ease-in-out infinite; }
        .char-container img { width: 100%; height: auto; }

        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* 말풍선 디자인 (검은색 테두리 + 꼬리 상단 이동) */
        .bubble {
            background: #f9f9f9; padding: 20px; border-radius: 20px; margin-bottom: 25px;
            font-size: 1.05rem; line-height: 1.5; font-weight: 600; color: #222;
            position: relative; border: 2px solid #333;
        }
        /* 말풍선 꼬리 (위쪽 캐릭터 방향) */
        .bubble::after {
            content: ''; position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            border-width: 0 12px 12px; border-style: solid; border-color: transparent transparent #333;
        }
        .bubble::before {
            content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            border-width: 0 10px 10px; border-style: solid; border-color: transparent transparent #f9f9f9;
            z-index: 1;
        }

        .btn {
            display: block; width: 100%; padding: 16px; margin: 10px 0;
            border: 1px solid #e0e0e0; border-radius: 12px; background: #ffffff;
            font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: 0.2s; color: #444;
        }
        .btn:hover { background: #333; color: #fff; border-color: #333; }
        .primary-btn { background: #333; color: #fff; border: none; font-weight: 700; }

        .heart-gauge { display: flex; justify-content: center; gap: 5px; margin: 20px 0 10px; font-size: 1.2rem; color: #ddd; }
        .heart.fill { color: #e74c3c; animation: heartBeat 0.3s ease; }
        @keyframes heartBeat { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        /* 결과 페이지 레이아웃 */
        .rank-container { display: flex; justify-content: space-between; align-items: flex-end; margin: 30px 0; gap: 8px; }
        .rank-box { flex: 1; text-align: center; border-radius: 15px; padding: 12px 5px; background: #fff; border: 2px solid transparent; }
        .rank-badge { display: block; font-size: 0.7rem; font-weight: 800; margin-bottom: 4px; }
        .rank-name { font-weight: 900; font-size: 0.9rem; word-wrap: break-word; line-height: 1.2; display: block; }
        .rank-1 { transform: scale(1.1); border-color: #FFD700; color: #6C63FF; padding: 18px 5px; }
        .rank-2 { border-color: #C0C0C0; color: #0070F3; }
        .rank-3 { border-color: #CD7F32; color: #23D5AB; }

        /* 상세 설명 섹션 */
        .desc-list { text-align: left; margin-top: 25px; background: #fdfdfd; padding: 20px; border-radius: 20px; border: 1px solid #eee; }
        .desc-item { margin-bottom: 15px; font-size: 0.85rem; line-height: 1.5; color: #555; }
        .desc-item b { font-weight: 700; color: #333; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div id="start-page" class="card">
        <div class="char-container"><img src="cha.png" alt="Character"></div>
        <div class="bubble">Hi! I'll help you find<br>your hidden abilities.</div>
        <button class="btn primary-btn" onclick="showPage('story-page')">Get Started</button>
    </div>

    <div id="story-page" class="card hidden">
        <div class="char-container"><img src="cha.png" alt="Character"></div>
        <div class="bubble">Imagine you are about to<br>start a new adventure.</div>
        <button class="btn primary-btn" onclick="startQuiz()">Yes, Let's go!</button>
    </div>

    <div id="quiz-page" class="card hidden">
        <div class="char-container"><img src="char_quiz.png" alt="Character"></div>
        <div class="bubble" id="question-text">질문을 불러오는 중...</div>
        <div id="options-container"></div>
        <div class="heart-gauge" id="heart-gauge"></div>
        <button id="prev-btn" style="background:none; border:none; color:#bbb; text-decoration:underline; cursor:pointer; margin-top:10px;" onclick="goBack()">Back to Previous</button>
    </div>

    <div id="result-page" class="card hidden">
        <div class="char-container"><img src="result_character.png" alt="Character"></div>
        <h2 style="font-weight: 900; font-size: 1.4rem;">Assessment Result</h2>
        <div class="rank-container" id="rank-display"></div>
        <div class="desc-list" id="desc-list"></div>
        <button class="btn primary-btn" onclick="location.reload()">Retake Test</button>
    </div>

    <script>
        const questions = [
            { q: "How do you gain energy on weekends?", options: [ {text: "Chatting with friends", type: "Communication"}, {text: "Solving puzzles", type: "Analysis"}, {text: "Gardening", type: "Nature"} ] },
            { q: "If you were stuck on a desert island?", options: [ {text: "Build a house", type: "Practicality"}, {text: "Make an escape plan", type: "Analysis"}, {text: "Create an SOS sign", type: "Creativity"} ] },
            { q: "Role in a school festival?", options: [ {text: "MC/Presenter", type: "Communication"}, {text: "Designer", type: "Creativity"}, {text: "Food booth", type: "Practicality"} ] },
            { q: "If you were to create an app?", options: [ {text: "Chatting app", type: "Communication"}, {text: "Data/Algorithms", type: "Analysis"}, {text: "Beautiful Design", type: "Creativity"} ] },
            { q: "Found a rare flower?", options: [ {text: "Search for its name", type: "Analysis"}, {text: "Draw it in detail", type: "Creativity"}, {text: "Clear away weeds", type: "Nature"} ] },
            { q: "How do you make up with a friend?", options: [ {text: "Heartfelt conversation", type: "Communication"}, {text: "Analyze the cause", type: "Analysis"}, {text: "Give a handmade gift", type: "Practicality"} ] },
            { q: "Favorite movie character type?", options: [ {text: "Inspirational leader", type: "Communication"}, {text: "Smart detective", type: "Analysis"}, {text: "Strong maker", type: "Practicality"} ] },
            { q: "What kind of cafe would you open?", options: [ {text: "Lecture cafe", type: "Communication"}, {text: "Gallery cafe", type: "Creativity"}, {text: "Garden cafe", type: "Nature"} ] },
            { q: "Your secret study method?", options: [ {text: "Explaining out loud", type: "Communication"}, {text: "Making mindmaps", type: "Analysis"}, {text: "Solving problems", type: "Practicality"} ] },
            { q: "Compliment you want to hear?", options: [ {text: "Great listener", type: "Communication"}, {text: "Sharp strategist", type: "Analysis"}, {text: "Amazing creator", type: "Creativity"} ] }
        ];

        let currentIdx = 0;
        let scores = { "Communication": 0, "Analysis": 0, "Nature": 0, "Practicality": 0, "Creativity": 0 };
        let choiceHistory = [];

        function showPage(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function startQuiz() {
            currentIdx = 0;
            scores = { "Communication": 0, "Analysis": 0, "Nature": 0, "Practicality": 0, "Creativity": 0 };
            choiceHistory = [];
            showPage('quiz-page');
            createHearts();
            renderQuestion();
        }

        function createHearts() {
            const gauge = document.getElementById('heart-gauge');
            gauge.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const span = document.createElement('span');
                span.className = 'heart';
                span.innerText = '♥';
                gauge.appendChild(span);
            }
        }

        function renderQuestion() {
            const qData = questions[currentIdx];
            document.getElementById('question-text').innerText = qData.q;
            const optionsBox = document.getElementById('options-container');
            optionsBox.innerHTML = '';
            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.type);
                optionsBox.appendChild(btn);
            });
            updateHearts();
            document.getElementById('prev-btn').style.display = currentIdx > 0 ? 'inline-block' : 'none';
        }

        function selectOption(type) {
            choiceHistory.push(type);
            scores[type]++;
            currentIdx++;
            if (currentIdx < questions.length) renderQuestion();
            else showResult();
        }

        function updateHearts() {
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach((h, i) => {
                if (i < currentIdx) h.classList.add('fill');
                else h.classList.remove('fill');
            });
        }

        function goBack() {
            if (currentIdx > 0) {
                currentIdx--;
                const lastType = choiceHistory.pop();
                scores[lastType]--;
                renderQuestion();
            }
        }

        function showResult() {
            showPage('result-page');
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            
            // 1, 2, 3등 박스 렌더링
            document.getElementById('rank-display').innerHTML = `
                <div class="rank-box rank-2"><span class="rank-badge">2nd</span><span class="rank-name">${sorted[1][0]}</span></div>
                <div class="rank-box rank-1"><span class="rank-badge">1st</span><span class="rank-name">${sorted[0][0]}</span></div>
                <div class="rank-box rank-3"><span class="rank-badge">3rd</span><span class="rank-name">${sorted[2][0]}</span></div>
            `;

            // 하단 상세 설명 렌더링
            document.getElementById('desc-list').innerHTML = sorted.slice(0, 3).map((item, index) => `
                <div class="desc-item">
                    <b>No.${index + 1} ${item[0]}:</b> ${getDescription(item[0])}
                </div>
            `).join('');
        }

        function getDescription(type) {
            const desc = {
                "Communication": "Excellent at connecting with people and creating harmony.",
                "Analysis": "A sharp strategist who sees the logic in complex situations.",
                "Practicality": "A doer who turns ideas into reality with strong action.",
                "Creativity": "Discovers new values and expresses them uniquely.",
                "Nature": "Has deep insight into the environment and connects with life."
            };
            return desc[type];
        }
    </script>
</body>
</html>
