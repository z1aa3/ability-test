<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adventure Ability Assessment</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

	html, body { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    /* 스크롤 방지 및 아이패드 튕김 현상 방지 */
    overflow: hidden; 
}

body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    /* 정중앙 정렬 핵심 설정 */
    display: flex; 
    justify-content: center; 
    align-items: center;
    width: 100%;
    height: 100dvh; /* 주소창 제외한 실제 화면 높이 */
    color: #333;
    /* 배경 관련 설정 */
    background-size: cover; 
    background-position: center; 
    background-repeat: no-repeat;
    transition: background-image 1.2s ease-in-out; 
    position: relative;
    -webkit-tap-highlight-color: transparent;
}

/* 아이패드 배경 고정 버그 해결을 위한 가상 요소 */
body::before {
    content: ""; 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: inherit; 
    background-size: cover; 
    background-position: center; 
    z-index: -1;
    /* iOS 하드웨어 가속 활성화 */
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
}

.card {
    width: 92%; 
    max-width: 500px; 
    padding: 35px 20px; 
    text-align: center;
    background: rgba(255, 255, 255, 0.94); 
    backdrop-filter: blur(10px);
    border-radius: 30px; 
    box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
    box-sizing: border-box; 
    z-index: 20;
    margin: 0; /* 불필요한 마진 제거 */
}

        /* 인트로 지도 */
        #intro-image {
            position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
            width: 440px; max-width: 85vw; height: auto; z-index: 5;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55); pointer-events: none;
        }
        #intro-image.moved {
            top: 60px; left: calc(100% - 40px); transform: translate(-100%, 0);
            width: 300px; z-index: 100; opacity: 0.9;
        }

        #intro-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: transparent; z-index: 10;
        }

        .card {
            width: 92%; max-width: 500px; padding: 35px 20px; text-align: center;
            background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(10px);
            border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); box-sizing: border-box; z-index: 20;
        }
        .hidden { display: none !important; }

.intro-title {
    /* 1. 폰트 없애기: 기본 시스템 폰트 사용 (또는 원하는 폰트 지정) */
    font-family: 'Pretendard', sans-serif; 
    
    /* 2. 크기 조절: 5rem에서 2.5rem~3rem 정도로 축소 */
    font-size: 2.8rem; 
    
    /* 3. 위치 조절: 위쪽 마진을 늘려 아래로 내림 (기존 220px에서 조절) */
    margin: 240px 0 20px 0; 
    
    /* 기타 스타일 */
    font-weight: 900;
    color: #2c3e50;
    text-align: center;
    text-transform: uppercase; /* 대문자로 만들면 더 깔끔합니다 */
    letter-spacing: 2px; /* 글자 간격을 약간 넓혀 고급스럽게 조정 */
}
        .start-btn {
            width: 280px; padding: 22px; border: none; border-radius: 20px;
            background: #333; color: #fff; font-size: 1.4rem; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 20px;
        }

        .char-container { width: 120px; margin: 0 auto 10px; animation: floating 3s ease-in-out infinite; }
        .char-container img { width: 100%; }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .bubble {
            background: #fff; padding: 20px; border-radius: 25px; margin-top: 10px; margin-bottom: 25px;
            font-size: 1.05rem; line-height: 1.5; font-weight: 700; border: 3px solid #333;
            position: relative; word-break: keep-all;
        }
        .bubble::before {
            content: ''; position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            border-width: 0 15px 15px; border-style: solid; border-color: transparent transparent #333;
        }

        /* 기본 버튼 설정 */
        .btn {
            display: block; width: 100%; padding: 16px; margin: 10px 0;
            border: 1px solid #ddd; border-radius: 15px; background: #fff;
            
            /* 아이패드 파란 글씨 방지 및 검정색 고정 */
            color: #333 !important; 
            -webkit-text-fill-color: #333 !important;
            
            font-size: 1rem; font-weight: 600; cursor: pointer; text-align: left;
            
            /* 터치 시 기본 회색 하이라이트 제거 */
            -webkit-tap-highlight-color: transparent; 
        }

        /* [PC용] 선택지 버튼에 마우스 올렸을 때 */
        @media (hover: hover) {
            .btn:not(.btn-continue):hover { 
                background: #333 !important; 
                color: #fff !important; 
                -webkit-text-fill-color: #fff !important;
            }
        }

        /* [아이패드용] 선택지 버튼 터치 시 즉각적인 반짝임 효과 */
        /* :active 상태에서 배경과 글자색을 반전시킵니다. */
        .btn:not(.btn-continue):active {
            background: #333 !important;
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
        }

        /* Continue Quest 버튼: 항상 검정 배경/흰 글씨로 고정 (터치 효과 없음) */
        .btn-continue {
            background: #333 !important;
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
            text-align: center !important;
            cursor: default;
        }

        /* Continue Quest 버튼은 눌러도 색상 변화가 없도록 재설정 */
        .btn-continue:active {
            background: #333 !important;
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
        }



/* 결과 카드 내부 레이아웃 수정 */
#result-page {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-height: 90vh; /* 화면을 벗어나지 않도록 제한 */
    overflow-y: auto; /* 전체 카드에 스크롤 허용 */
}

/* 캐릭터 이미지 크기 강조 */
#result-page .char-container {
    width: 180px; /* 기존보다 크게 설정 */
    margin: 10px auto 20px;
    flex-shrink: 0;
}

/* 순위 박스 컨테이너 */
.rank-wrapper {
    display: flex;
    justify-content: center;
    align-items: flex-end; /* 아래쪽 정렬로 높이 차이 강조 */
    gap: 10px;
    width: 100%;
    margin-bottom: 30px;
    flex-shrink: 0;
}

/* 2. 개별 순위 박스: 높이를 딱 고정해서 짧게 만듦 */
.rank-box {
    display: flex;
    flex-direction: column;
    justify-content: center; /* 내부 텍스트 세로 중앙 정렬 */
    align-items: center;
    width: 28%;
    height: 60px; /* ★ 이 숫자를 조절하면 박스 길이가 바뀝니다 ★ */
    border-radius: 12px;
    background: #fff;
    border: 2px solid #eee;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transition: all 0.3s ease;
}

/* 3. 내부 글자들 간격 밀착 */
.rank-badge {
    display: block;
    font-size: 0.65rem;
    font-weight: 800;
    margin-bottom: 2px;
    padding: 1px 6px;
    border-radius: 4px;
}

.rank-name {
    font-weight: 900;
    font-size: 1.2rem;
    display: block;
    color: #333;
}

/* 4. 순위별 색상 및 강조 (커지는 효과 최소화) */
.gold {
    height: 75px; /* 1위만 아주 살짝 길게 */
    border-color: #FFD700 !important;
    transform: scale(1.05);
    z-index: 2;
    order: 2;
}
.gold .rank-badge { background: #FFD700; color: #856404; }

.silver {
    border-color: #C0C0C0 !important;
    order: 1;
}
.silver .rank-badge { background: #C0C0C0; color: #444; }

.bronze {
    border-color: #CD7F32 !important;
    order: 3;
}
.bronze .rank-badge { background: #CD7F32; color: #fff; }

/* 상세 설명 영역 - 스크롤 가능하도록 설정 */
.desc-area {
    width: 100%;
    text-align: left;
    background: rgba(255, 255, 255, 0.6);
    padding: 20px;
    border-radius: 20px;
    border: 1px solid #eee;
    box-sizing: border-box;
    /* 설명이 길어질 경우 내부에서 스크롤 */
    overflow-y: visible; 
    margin-bottom: 20px;
}

.desc-item {
    margin-bottom: 20px;
}

.desc-item:last-child {
    margin-bottom: 0;
}

/* 설명문 1,2,3위별 폰트 컬러 */
#desc-list .desc-item:nth-child(1) b { color: #6C63FF !important; }
#desc-list .desc-item:nth-child(2) b { color: #0070F3 !important; }
#desc-list .desc-item:nth-child(3) b { color: #23D5AB !important; }

        .heart-gauge { display: flex; justify-content: center; gap: 4px; margin-top: 15px; font-size: 1.2rem; color: #eee; }
        .heart.fill { color: #e74c3c; }
        .stage-indicator { font-weight: 900; color: #aaa; font-size: 0.8rem; margin-bottom: 5px; text-transform: uppercase; }
    </style>
</head>
<body ontouchstart="">

    <img src="jido.png" id="intro-image" alt="Intro Map">

<div id="intro-page">
    <h2 class="intro-title">QUEST TITLE</h2> <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
        <button class="start-btn" onclick="goToStory(1)">Start Journey</button>
        <button class="start-btn" style="background: #555;" onclick="showRecords()">Records</button>
    </div>
</div>

	<div id="story-page" class="card hidden">
    <div class="stage-indicator" id="story-stage-text">Stage 1</div>
    <div class="char-container"><img src="cha.png" alt="Character"></div>
    <div class="bubble" id="story-text"></div>
<button class="btn btn-continue" onclick="startQuizFromStory()">Continue Quest</button>
	</div>

    <div id="quiz-page" class="card hidden">
        <div class="stage-indicator" id="quiz-stage-text">Stage 1</div>
        <div class="char-container"><img src="cha.png" alt="Character"></div>
        <div class="bubble" id="question-text"></div>
        <div id="options-container"></div>
        <div class="heart-gauge" id="heart-gauge"></div>
        <button id="prev-btn" style="background:none; border:none; color:#999; text-decoration:underline; cursor:pointer; margin-top:10px; font-weight:700;" onclick="goBack()">Back</button>
    </div>

<div id="result-page" class="card hidden">
    <h2 style="font-weight: 900; font-size: 1.6rem; margin-bottom: 15px;">Quest Complete!</h2>
    
    <div class="char-container">
        <img src="result_character.png" alt="Character">
    </div>

    <div class="rank-wrapper" id="rank-container"></div>
    <div class="desc-area" id="desc-list"></div>

    <div id="mini-game-selection" style="margin-top: 20px; padding-top: 20px; border-top: 2px dashed #eee; width: 100%;">
        <p style="font-weight: 800; font-size: 1rem; margin-bottom: 15px; color: #555;">🎮 Bonus: Ability Training</p>
        <div style="display: flex; gap: 10px;">
            <button class="btn" style="text-align: center; flex: 1; margin: 0; padding: 12px 5px;" onclick="startMiniGame('speed')">Speed Test</button>
            <button class="btn" style="text-align: center; flex: 1; margin: 0; padding: 12px 5px;" onclick="startMiniGame('memory')">Memory Test</button>
        </div>
    </div>

    <button class="start-btn" style="width:100%; margin-top: 20px;" onclick="location.reload()">Retake Journey</button>
</div> <div id="game-page" class="card hidden" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999; background: white !important; width: 92%; max-width: 450px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 2px solid #333;">
    <h3 id="game-title" style="font-weight: 900; margin-bottom: 20px; color: #333; font-size: 1.4rem;">Game Title</h3>
    <div id="game-content" style="width: 100%; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center;"></div>
    <button class="start-btn" onclick="closeGame()" style="width: 100%; margin-top: 20px; background: #ff4757; font-size: 1.1rem; padding: 15px;">Exit to Result</button>
</div>

<div id="record-modal" class="card hidden" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: white; width: 85%; max-width: 400px;">
        <h3 style="font-weight: 900; margin-bottom: 15px;">Your Past Victories</h3>
        <div id="record-content" style="margin: 20px 0; text-align: left; font-size: 0.9rem; max-height: 200px; overflow-y: auto;">
            </div>
        <button class="btn btn-continue" onclick="closeRecords()">Close</button>
    </div>
</body>

    <script>
const backgrounds = { stage1: "url('muindo.jpeg')", stage2: "url('samak.jpeg')", stage3: "url('jungle.jpeg')" };
        const stageStories = {
            1: "🏝️ Stage 1: The Island (Quest 1-5)",
            2: "🏜️ Stage 2: The Desert (Quest 6-10)",
            3: "🌿 Stage 3: The Jungle (Quest 11-15)"
        };

        const questions = [
            // Stage 1
            { stage: 1, q: "We woke up on a beach! First move?", options: [{text: "Everyone, follow me. Let’s make a plan.", type: "Commander"}, {text: "I'll search for stones or wood to make tools.", type: "Engineer"}, {text: "I'll scan the island and imagine the map.", type: "Artist"}]},
            { stage: 1, q: "So thirsty... How to get water?", options: [{text: "I'll climb the tree and get coconuts.", type: "Athlete"}, {text: "I'll build a rain-catching system.", type: "Engineer"}, {text: "I'll find green plants. Water is near them.", type: "Explorer"}]},
            { stage: 1, q: "An old map in the sand! What’s your take?", options: [{text: "I'll solve the hidden codes on it.", type: "Strategist"}, {text: "Who lived here? Let's find their traces.", type: "Explorer"}, {text: "I'll redraw it to make it look clearer.", type: "Artist"}]},
            { stage: 1, q: "Shh! Something is moving in the bushes!", options: [{text: "I'll go first with a weapon. Stay back.", type: "Athlete"}, {text: "Wait. Let's analyze its movement pattern.", type: "Strategist"}, {text: "I'll use some food to bait it out.", type: "Engineer"}]},
            { stage: 1, q: "A plane! How to send a signal?", options: [{text: "I'll make a giant 'HELP' sign to catch attention.", type: "Artist"}, {text: "I'll build a fire with thick black smoke.", type: "Engineer"}, {text: "Everyone! Wave your clothes together!", type: "Commander"}]},
            // Stage 2
            { stage: 2, q: "Heavy water bags to carry. Can you help?", options: [{text: "No problem. I'll carry the heaviest ones.", type: "Athlete"}, {text: "Let’s find the shortest route to save energy.", type: "Strategist"}, {text: "I’ll tie them to pull them like a sled.", type: "Engineer"}]},
            { stage: 2, q: "It's melting hot! How to stay cool?", options: [{text: "I'll find a spot with a cool breeze.", type: "Artist"}, {text: "Let's rest in the shade. Safety first!", type: "Commander"}, {text: "I'll only walk in the shadows of the rocks.", type: "Strategist"}]},
            { stage: 2, q: "Whoa, a Pyramid! What do you notice first?", options: [{text: "How did they build this without machines?", type: "Engineer"}, {text: "The scale is unreal. It’s like a giant art.", type: "Artist"}, {text: "I'll look for secret symbols on the walls.", type: "Strategist"}]},
            { stage: 2, q: "A traveler is over there. Talk to him?", options: [{text: "I'll negotiate with him for our team.", type: "Commander"}, {text: "Wait. I'll watch his face to see if he's nice.", type: "Explorer"}, {text: "I'll use hand gestures to vibe with him.", type: "Artist"}]},
            { stage: 2, q: "The traveler wants to give you a gift!", options: [{text: "A Flying Drone to see the whole map.", type: "Strategist"}, {text: "A Strong Tool-kit to fix anything.", type: "Engineer"}, {text: "A Zoom-Camera to see things far away.", type: "Artist"}]},
            // Stage 3
            { stage: 3, q: "It's a green maze. How to move?", options: [{text: "I’ll clear the path with my strength.", type: "Athlete"}, {text: "Check the compass. Stick to the heading.", type: "Strategist"}, {text: "I'll track the sun to find the way out.", type: "Explorer"}]},
            { stage: 3, q: "A monkey took our bag! The plan?", options: [{text: "I'll chase it! I'm faster than a monkey.", type: "Athlete"}, {text: "Let's distract it with fruit.", type: "Strategist"}, {text: "Let it go. Team safety is more important.", type: "Commander"}]},
            { stage: 3, q: "We found locals! They look suspicious.", options: [{text: "I'll go talk to their leader first.", type: "Commander"}, {text: "I'll watch and learn their culture first.", type: "Explorer"}, {text: "I'll show them our cool items.", type: "Artist"}]},
            { stage: 3, q: "A local festival! What are you doing?", options: [{text: "I’ll enjoy their music and performance.", type: "Artist"}, {text: "I'll sit and learn their language.", type: "Explorer"}, {text: "I’ll help them set up the heavy stuff.", type: "Athlete"}]},
            { stage: 3, q: "We escaped! What was your best skill?", options: [{text: "My ability to lead the whole team.", type: "Commander"}, {text: "My skill to build tools to survive.", type: "Engineer"}, {text: "My curiosity to adapt to a new world.", type: "Explorer"}]}
        ];

        let currentIdx = 0;
        let scores = { "Commander": 0, "Athlete": 0, "Strategist": 0, "Engineer": 0, "Artist": 0, "Explorer": 0 };
        let history = [];
        let currentStage = 0;

        const descs = {
            "Commander": "Interpersonal, Linguistic, and Teaching excellence.",
            "Athlete": "Superior physical movement and kinetic intelligence.",
            "Strategist": "Advanced logical reasoning and problem-solving skills.",
            "Engineer": "Digital proficiency and technical construction ability.",
            "Artist": "Exceptional musical and visual-spatial creativity.",
            "Explorer": "Deep connection to nature, intrapersonal and spiritual wisdom."
        };

        function goToStory(stage) {
            currentStage = stage;
            document.getElementById('intro-image').classList.add('moved');
            document.getElementById('intro-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.add('hidden');
            const storyPage = document.getElementById('story-page');
            storyPage.classList.remove('hidden');
            document.body.style.backgroundImage = backgrounds[`stage${stage}`];
            document.getElementById('story-stage-text').innerText = `Quest Stage ${stage}`;
            document.getElementById('story-text').innerHTML = stageStories[stage];
        }

        function startQuizFromStory() {
            document.getElementById('story-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            createHearts();
            renderQuestion();
        }

        function createHearts() {
            const gauge = document.getElementById('heart-gauge');
            gauge.innerHTML = '';
            for (let i = 0; i < 5; i++) { // 각 스테이지당 5문제 기준
                const s = document.createElement('span');
                s.className = 'heart'; s.innerText = '♥';
                gauge.appendChild(s);
            }
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            if (q.stage !== currentStage) { goToStory(q.stage); return; }
            document.getElementById('quiz-stage-text').innerText = `Quest Stage ${q.stage}`;
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach(opt => {
                const b = document.createElement('button');
                b.className = 'btn'; b.innerText = opt.text;
                b.onclick = () => select(opt.type);
                container.appendChild(b);
            });
            const hearts = document.querySelectorAll('.heart');
            const activeIdx = currentIdx % 5;
            hearts.forEach((h, i) => {
                if (i <= activeIdx) h.classList.add('fill');
                else h.classList.remove('fill');
            });
            document.getElementById('prev-btn').style.visibility = currentIdx > 0 ? 'visible' : 'hidden';
        }

        function select(type) {
            history.push(type);
            scores[type]++;
            currentIdx++;
            if (currentIdx < questions.length) renderQuestion();
            else showResult();
        }

        function goBack() {
            if (currentIdx > 0) {
                currentIdx--;
                const last = history.pop();
                scores[last]--;
                currentStage = questions[currentIdx].stage;
                renderQuestion();
            }
        }

function showResult() {
    // 1. 페이지 전환 (퀴즈 숨기고 결과창 보이기)
    document.getElementById('quiz-page').classList.add('hidden');
    document.getElementById('result-page').classList.remove('hidden');
    
    // 2. 점수 높은 순으로 정렬
    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const topAbility = sorted[0][0]; // 1위 역량 명칭 추출

    // 3. 캐릭터 이미지 변경
    const charImg = document.querySelector('#result-page .char-container img');
    charImg.src = "result_" + topAbility + ".png"; 
    charImg.alt = topAbility + " Character";

    // 4. 상단 순위 박스 렌더링
    const container = document.getElementById('rank-container');
    container.innerHTML = `
        <div class="rank-box silver">
            <span class="rank-badge">2nd</span>
            <span class="rank-name">${sorted[1][0]}</span>
        </div>
        <div class="rank-box gold">
            <span class="rank-badge">1st</span>
            <span class="rank-name">${sorted[0][0]}</span>
        </div>
        <div class="rank-box bronze">
            <span class="rank-badge">3rd</span>
            <span class="rank-name">${sorted[2][0]}</span>
        </div>
    `;

    // 5. 하단 상세 설명 리스트 렌더링
    const descList = document.getElementById('desc-list');
    descList.innerHTML = sorted.slice(0, 3).map((item, i) => `
        <div class="desc-item">
            <b>Rank ${i + 1} - ${item[0]} Ability</b>
            ${descs[item[0]] || "A unique and valuable talent discovered in the wild."}
        </div>
    `).join('');

    // 6. 결과 기록 저장 (로컬 스토리지)
    let historyRecords = JSON.parse(localStorage.getItem('adventure_history') || "[]");
    const newRecord = {
        date: new Date().toLocaleDateString(), // 오늘 날짜
        ability: topAbility
    };
    historyRecords.unshift(newRecord); // 최신 기록을 맨 앞으로
    localStorage.setItem('adventure_history', JSON.stringify(historyRecords.slice(0, 5))); // 5개까지만 유지
}

// 기록 창을 여는 함수
function showRecords() {
    const modal = document.getElementById('record-modal');
    const content = document.getElementById('record-content');
    const records = JSON.parse(localStorage.getItem('adventure_history') || "[]");

    if (records.length === 0) {
        content.innerHTML = "<p style='text-align:center; color:#999; padding:20px 0;'>No records found yet.<br>Complete a journey first!</p>";
    } else {
        content.innerHTML = records.map(r => `
            <div style="border-bottom: 1px solid #eee; padding: 12px 0; display: flex; justify-content: space-between; align-items: center;">
                <span style="font-weight: 800; color: #333;">${r.ability}</span>
                <span style="color: #888; font-size: 0.8rem;">${r.date}</span>
            </div>
        `).join('');
    }
    modal.classList.remove('hidden');
}

// 기록 창을 닫는 함수
function closeRecords() {
    document.getElementById('record-modal').classList.add('hidden');
}

let currentMemoryLevel = 1;
let flippedCards = [];
let matchedCount = 0;
let speedTrials = []; 
// 아이콘 리스트 (충분히 넉넉하게 준비)
let memoryIcons = ['🔥', '💧', '🌿', '⚡', '💎', '🏆', '⚓', '🏹', '🛡️', '🔑', '🍎', '⭐', '🌈', '☀', '🌙', '🍀', '🎈', '🎁', '🎸', '🎨', '🚀', '🛸', '👾', '👻', '🎃', '🐯', '🐼', '🦊', '🦀', '🦄'];

function startMiniGame(type, level = 1) {
    document.getElementById('result-page').classList.add('hidden');
    const gamePage = document.getElementById('game-page');
    gamePage.classList.remove('hidden');
    gamePage.style.display = "block";
    
    const content = document.getElementById('game-content');
    const title = document.getElementById('game-title');
    content.innerHTML = ""; 
    flippedCards = [];
    matchedCount = 0;
    currentMemoryLevel = level;

    if (type === 'speed') {
        speedTrials = [];
        runSpeedTrial(1);
    } else if (type === 'memory') {
        // 레벨별 카드 개수 설정 (2x2, 4x4 등)
        const config = { 1: 2, 2: 4, 3: 4, 4: 6, 5: 6 }; 
        const size = config[level];
        const totalCards = size * size;
        
        title.innerText = `🧠 Memory Level ${level}`;
        content.innerHTML = `<div id="card-grid" style="display:grid; grid-template-columns:repeat(${size}, 1fr); gap:8px; width:100%; max-width:350px;"></div>`;
        
        const grid = document.getElementById('card-grid');
        let selectedIcons = memoryIcons.slice(0, totalCards / 2);
        let deck = [...selectedIcons, ...selectedIcons].sort(() => Math.random() - 0.5);

        deck.forEach((icon) => {
            const card = document.createElement('div');
            // 기본 상태: 검정색 배경, 글자 숨김
            card.style = `height:60px; background:#333; color:transparent; display:flex; align-items:center; justify-content:center; border-radius:12px; cursor:pointer; font-size:1.5rem; transition: background 0.3s, color 0.3s;`;
            card.dataset.icon = icon;
            card.innerText = icon;
            
            card.onclick = function() {
                // 이미 뒤집혔거나 짝이 맞은 카드는 클릭 방지
                if (flippedCards.length < 2 && this.style.color === "transparent") {
                    this.style.color = "white";
                    this.style.background = "#6c63ff"; // 선택된 카드는 보라색
                    flippedCards.push(this);
                    
                    if (flippedCards.length === 2) {
                        setTimeout(() => checkMatch(totalCards), 500);
                    }
                }
            };
            grid.appendChild(card);
        });
    }
}

function checkMatch(totalCards) {
    const [c1, c2] = flippedCards;
    
    if (c1.dataset.icon === c2.dataset.icon) {
        // 짝이 맞았을 때: 초록색으로 변경 및 고정
        c1.style.background = "#2ecc71";
        c2.style.background = "#2ecc71";
        c1.style.color = "white";
        c2.style.color = "white";
        // 클릭 이벤트 제거를 위해 상태 표시 (이미 color가 transparent가 아니므로 클릭 안 됨)
        
        matchedCount += 2;
        if (matchedCount >= totalCards) {
            setTimeout(() => {
                if (currentMemoryLevel < 5) {
                    if(confirm(`Level ${currentMemoryLevel} 클리어! 다음 레벨로 가시겠습니까?`)) {
                        startMiniGame('memory', currentMemoryLevel + 1);
                    }
                } else {
                    alert("축하합니다! 모든 메모리 테스트를 통과하셨습니다!");
                }
            }, 300);
        }
    } else {
        // 틀렸을 때: 다시 검정색으로 원복
        c1.style.color = "transparent";
        c1.style.background = "#333";
        c2.style.color = "transparent";
        c2.style.background = "#333";
    }
    flippedCards = [];
}

// 스피드 게임 및 기타 유틸리티 함수 (기존 유지)
function runSpeedTrial(count) {
    const content = document.getElementById('game-content');
    document.getElementById('game-title').innerText = `⚡ Speed Test (${count}/3)`;
    content.innerHTML = `<div id="target" style="width:150px; height:150px; background:#ff4757; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; color:white; font-weight:900; font-size:1.2rem;">WAIT</div>`;

    const target = document.getElementById('target');
    const waitTime = Math.random() * 2000 + 1500; 
    const timeoutId = setTimeout(() => {
        target.style.background = "#2ecc71";
        target.innerText = "CLICK!!";
        let startTime = Date.now();
        target.onclick = function() {
            let reactionTime = (Date.now() - startTime) / 1000;
            speedTrials.push(reactionTime);
            if (speedTrials.length < 3) runSpeedTrial(speedTrials.length + 1);
            else showSpeedResult();
        };
    }, waitTime);

    target.onmousedown = function() {
        if(target.innerText === "WAIT") {
            clearTimeout(timeoutId);
            alert("너무 빨라요! 초록색이 되면 누르세요.");
            runSpeedTrial(count);
        }
    };
}

function showSpeedResult() {
    const avg = (speedTrials.reduce((a, b) => a + b, 0) / 3).toFixed(3);
    document.getElementById('game-content').innerHTML = `
        <h1 style="font-size:3rem; color:#6c63ff;">${avg}s</h1>
        <p>평균 반응 속도</p>
        <button class="start-btn" onclick="startMiniGame('speed')">다시 하기</button>
    `;
}

function closeGame() {
    document.getElementById('game-page').classList.add('hidden');
    document.getElementById('game-page').style.display = "none";
    document.getElementById('result-page').classList.remove('hidden');
}
    </script>
