<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adventure Ability Assessment</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

	html, body { 
    margin: 0; 
    padding: 0; 
    width: 100%; 
    height: 100%; 
    /* 스크롤 방지 및 아이패드 튕김 현상 방지 */
    overflow: hidden; 
}

body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    /* 정중앙 정렬 핵심 설정 */
    display: flex; 
    justify-content: center; 
    align-items: center;
    width: 100%;
    height: 100dvh; /* 주소창 제외한 실제 화면 높이 */
    color: #333;
    /* 배경 관련 설정 */
    background-size: cover; 
    background-position: center; 
    background-repeat: no-repeat;
    transition: background-image 1.2s ease-in-out; 
    position: relative;
    -webkit-tap-highlight-color: transparent;
}

/* 아이패드 배경 고정 버그 해결을 위한 가상 요소 */
body::before {
    content: ""; 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: inherit; 
    background-size: cover; 
    background-position: center; 
    z-index: -1;
    /* iOS 하드웨어 가속 활성화 */
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
}

.card {
    width: 92%; 
    max-width: 500px; 
    padding: 35px 20px; 
    text-align: center;
    background: rgba(255, 255, 255, 0.94); 
    backdrop-filter: blur(10px);
    border-radius: 30px; 
    box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
    box-sizing: border-box; 
    z-index: 20;
    margin: 0; /* 불필요한 마진 제거 */
}

        /* 인트로 지도 */
        #intro-image {
            position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
            width: 440px; max-width: 85vw; height: auto; z-index: 5;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55); pointer-events: none;
        }
        #intro-image.moved {
            top: 60px; left: calc(100% - 40px); transform: translate(-100%, 0);
            width: 300px; z-index: 100; opacity: 0.9;
        }

        #intro-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: transparent; z-index: 10;
        }

        .card {
            width: 92%; max-width: 500px; padding: 35px 20px; text-align: center;
            background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(10px);
            border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); box-sizing: border-box; z-index: 20;
        }
        .hidden { display: none !important; }

        .intro-title {
            font-family: 'Dancing Script', cursive; font-size: 5rem; margin: 220px 0 0 0;
            color: #2c3e50; text-shadow: 0 2px 15px rgba(255,255,255,1);
        }
        .intro-desc { 
            font-size: 1.2rem; font-weight: 800; margin: 20px 0 40px 0; color: #333; 
            line-height: 1.6; word-break: keep-all; max-width: 85%;
        }
        
        .start-btn {
            width: 280px; padding: 22px; border: none; border-radius: 20px;
            background: #333; color: #fff; font-size: 1.4rem; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 20px;
        }

        .char-container { width: 120px; margin: 0 auto 10px; animation: floating 3s ease-in-out infinite; }
        .char-container img { width: 100%; }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .bubble {
            background: #fff; padding: 20px; border-radius: 25px; margin-top: 10px; margin-bottom: 25px;
            font-size: 1.05rem; line-height: 1.5; font-weight: 700; border: 3px solid #333;
            position: relative; word-break: keep-all;
        }
        .bubble::before {
            content: ''; position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            border-width: 0 15px 15px; border-style: solid; border-color: transparent transparent #333;
        }

        /* 기본 버튼 설정 */
        .btn {
            display: block; width: 100%; padding: 16px; margin: 10px 0;
            border: 1px solid #ddd; border-radius: 15px; background: #fff;
            
            /* 아이패드 파란 글씨 방지 및 검정색 고정 */
            color: #333 !important; 
            -webkit-text-fill-color: #333 !important;
            
            font-size: 1rem; font-weight: 600; cursor: pointer; text-align: left;
            
            /* 터치 시 기본 회색 하이라이트 제거 */
            -webkit-tap-highlight-color: transparent; 
        }

        /* [PC용] 선택지 버튼에 마우스 올렸을 때 */
        @media (hover: hover) {
            .btn:not(.btn-continue):hover { 
                background: #333 !important; 
                color: #fff !important; 
                -webkit-text-fill-color: #fff !important;
            }
        }

        /* [아이패드용] 선택지 버튼 터치 시 즉각적인 반짝임 효과 */
        /* :active 상태에서 배경과 글자색을 반전시킵니다. */
        .btn:not(.btn-continue):active {
            background: #333 !important;
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
        }

        /* Continue Quest 버튼: 항상 검정 배경/흰 글씨로 고정 (터치 효과 없음) */
        .btn-continue {
            background: #333 !important;
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
            text-align: center !important;
            cursor: default;
        }

        /* Continue Quest 버튼은 눌러도 색상 변화가 없도록 재설정 */
        .btn-continue:active {
            background: #333 !important;
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
        }



/* 결과 카드 전체 레이아웃 개선 */
#result-page {
    padding: 40px 20px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(15px);
}

/* 1. 박스들을 감싸는 컨테이너: 높이를 제한해서 늘어남 방지 */
.rank-wrapper {
    display: flex;
    justify-content: center;
    align-items: center; /* 박스들을 세로 중앙에 정렬 */
    margin: 25px 0;
    gap: 8px;
    height: 100px; /* 컨테이너 높이 고정 */
}

/* 2. 개별 순위 박스: 높이를 딱 고정해서 짧게 만듦 */
.rank-box {
    display: flex;
    flex-direction: column;
    justify-content: center; /* 내부 텍스트 세로 중앙 정렬 */
    align-items: center;
    width: 28%;
    height: 60px; /* ★ 이 숫자를 조절하면 박스 길이가 바뀝니다 ★ */
    border-radius: 12px;
    background: #fff;
    border: 2px solid #eee;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transition: all 0.3s ease;
}

/* 3. 내부 글자들 간격 밀착 */
.rank-badge {
    display: block;
    font-size: 0.65rem;
    font-weight: 800;
    margin-bottom: 2px;
    padding: 1px 6px;
    border-radius: 4px;
}

.rank-name {
    font-weight: 900;
    font-size: 1.2rem;
    display: block;
    color: #333;
}

/* 4. 순위별 색상 및 강조 (커지는 효과 최소화) */
.gold {
    height: 75px; /* 1위만 아주 살짝 길게 */
    border-color: #FFD700 !important;
    transform: scale(1.05);
    z-index: 2;
    order: 2;
}
.gold .rank-badge { background: #FFD700; color: #856404; }

.silver {
    border-color: #C0C0C0 !important;
    order: 1;
}
.silver .rank-badge { background: #C0C0C0; color: #444; }

.bronze {
    border-color: #CD7F32 !important;
    order: 3;
}
.bronze .rank-badge { background: #CD7F32; color: #fff; }

/* 상세 설명 영역 */
.desc-area {
    text-align: left;
    margin-top: 30px;
    background: rgba(255, 255, 255, 0.6);
    padding: 25px;
    border-radius: 20px;
    border: 1px solid #eee;
}

.desc-item {
    margin-bottom: 18px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: #555;
}

.desc-item b {
    font-weight: 800;
    font-size: 1.05rem;
    display: block;
    margin-bottom: 3px;
}

/* 설명문 1,2,3위별 폰트 컬러 */
#desc-list .desc-item:nth-child(1) b { color: #6C63FF !important; }
#desc-list .desc-item:nth-child(2) b { color: #0070F3 !important; }
#desc-list .desc-item:nth-child(3) b { color: #23D5AB !important; }

        .heart-gauge { display: flex; justify-content: center; gap: 4px; margin-top: 15px; font-size: 1.2rem; color: #eee; }
        .heart.fill { color: #e74c3c; }
        .stage-indicator { font-weight: 900; color: #aaa; font-size: 0.8rem; margin-bottom: 5px; text-transform: uppercase; }
    </style>
</head>
<body ontouchstart="">

    <img src="jido.png" id="intro-image" alt="Intro Map">

    <div id="intro-page">
        <h2 class="intro-title">Welcome!</h2>
        <p class="intro-desc">
            Embark on a legendary quest to uncover the hidden powers within you. 
            Navigate through mysterious islands, scorching deserts, and deep jungles. 
            Every choice you make defines your true potential. 
            Are you ready to face the challenges and find your destiny?
        </p>
        <button class="start-btn" onclick="goToStory(1)">Start Journey</button>
    </div>

	<div id="story-page" class="card hidden">
    <div class="stage-indicator" id="story-stage-text">Stage 1</div>
    <div class="char-container"><img src="cha.png" alt="Character"></div>
    <div class="bubble" id="story-text"></div>
<button class="btn btn-continue" onclick="startQuizFromStory()">Continue Quest</button>
	</div>

    <div id="quiz-page" class="card hidden">
        <div class="stage-indicator" id="quiz-stage-text">Stage 1</div>
        <div class="char-container"><img src="cha.png" alt="Character"></div>
        <div class="bubble" id="question-text"></div>
        <div id="options-container"></div>
        <div class="heart-gauge" id="heart-gauge"></div>
        <button id="prev-btn" style="background:none; border:none; color:#999; text-decoration:underline; cursor:pointer; margin-top:10px; font-weight:700;" onclick="goBack()">Back</button>
    </div>

    <div id="result-page" class="card hidden">
        <h2 style="font-weight: 900; font-size: 1.6rem; margin-bottom: 10px;">Assessment Result</h2>
        <div class="char-container"><img src="result_character.png" alt="Character"></div>
        <div class="rank-wrapper" id="rank-container"></div>
        <div class="desc-area" id="desc-list"></div>
        <button class="start-btn" style="width:100%; margin-top:25px;" onclick="location.reload()">Retake Journey</button>
    </div>

    <script>
const backgrounds = { stage1: "url('muindo.jpeg')", stage2: "url('samak.jpeg')", stage3: "url('jungle.jpeg')" };
        const stageStories = {
            1: "🏝️ Stage 1: The Island (Quest 1-5)",
            2: "🏜️ Stage 2: The Desert (Quest 6-10)",
            3: "🌿 Stage 3: The Jungle (Quest 11-15)"
        };

        const questions = [
            // Stage 1
            { stage: 1, q: "We woke up on a beach! First move?", options: [{text: "Everyone, follow me. Let’s make a plan.", type: "Commander"}, {text: "I'll search for stones or wood to make tools.", type: "Engineer"}, {text: "I'll scan the island and imagine the map.", type: "Artist"}]},
            { stage: 1, q: "So thirsty... How to get water?", options: [{text: "I'll climb the tree and get coconuts.", type: "Athlete"}, {text: "I'll build a rain-catching system.", type: "Engineer"}, {text: "I'll find green plants. Water is near them.", type: "Explorer"}]},
            { stage: 1, q: "An old map in the sand! What’s your take?", options: [{text: "I'll solve the hidden codes on it.", type: "Strategist"}, {text: "Who lived here? Let's find their traces.", type: "Explorer"}, {text: "I'll redraw it to make it look clearer.", type: "Artist"}]},
            { stage: 1, q: "Shh! Something is moving in the bushes!", options: [{text: "I'll go first with a weapon. Stay back.", type: "Athlete"}, {text: "Wait. Let's analyze its movement pattern.", type: "Strategist"}, {text: "I'll use some food to bait it out.", type: "Engineer"}]},
            { stage: 1, q: "A plane! How to send a signal?", options: [{text: "I'll make a giant 'HELP' sign to catch attention.", type: "Artist"}, {text: "I'll build a fire with thick black smoke.", type: "Engineer"}, {text: "Everyone! Wave your clothes together!", type: "Commander"}]},
            // Stage 2
            { stage: 2, q: "Heavy water bags to carry. Can you help?", options: [{text: "No problem. I'll carry the heaviest ones.", type: "Athlete"}, {text: "Let’s find the shortest route to save energy.", type: "Strategist"}, {text: "I’ll tie them to pull them like a sled.", type: "Engineer"}]},
            { stage: 2, q: "It's melting hot! How to stay cool?", options: [{text: "I'll find a spot with a cool breeze.", type: "Artist"}, {text: "Let's rest in the shade. Safety first!", type: "Commander"}, {text: "I'll only walk in the shadows of the rocks.", type: "Strategist"}]},
            { stage: 2, q: "Whoa, a Pyramid! What do you notice first?", options: [{text: "How did they build this without machines?", type: "Engineer"}, {text: "The scale is unreal. It’s like a giant art.", type: "Artist"}, {text: "I'll look for secret symbols on the walls.", type: "Strategist"}]},
            { stage: 2, q: "A traveler is over there. Talk to him?", options: [{text: "I'll negotiate with him for our team.", type: "Commander"}, {text: "Wait. I'll watch his face to see if he's nice.", type: "Explorer"}, {text: "I'll use hand gestures to vibe with him.", type: "Artist"}]},
            { stage: 2, q: "The traveler wants to give you a gift!", options: [{text: "A Flying Drone to see the whole map.", type: "Strategist"}, {text: "A Strong Tool-kit to fix anything.", type: "Engineer"}, {text: "A Zoom-Camera to see things far away.", type: "Artist"}]},
            // Stage 3
            { stage: 3, q: "It's a green maze. How to move?", options: [{text: "I’ll clear the path with my strength.", type: "Athlete"}, {text: "Check the compass. Stick to the heading.", type: "Strategist"}, {text: "I'll track the sun to find the way out.", type: "Explorer"}]},
            { stage: 3, q: "A monkey took our bag! The plan?", options: [{text: "I'll chase it! I'm faster than a monkey.", type: "Athlete"}, {text: "Let's distract it with fruit.", type: "Strategist"}, {text: "Let it go. Team safety is more important.", type: "Commander"}]},
            { stage: 3, q: "We found locals! They look suspicious.", options: [{text: "I'll go talk to their leader first.", type: "Commander"}, {text: "I'll watch and learn their culture first.", type: "Explorer"}, {text: "I'll show them our cool items.", type: "Artist"}]},
            { stage: 3, q: "A local festival! What are you doing?", options: [{text: "I’ll enjoy their music and performance.", type: "Artist"}, {text: "I'll sit and learn their language.", type: "Explorer"}, {text: "I’ll help them set up the heavy stuff.", type: "Athlete"}]},
            { stage: 3, q: "We escaped! What was your best skill?", options: [{text: "My ability to lead the whole team.", type: "Commander"}, {text: "My skill to build tools to survive.", type: "Engineer"}, {text: "My curiosity to adapt to a new world.", type: "Explorer"}]}
        ];

        let currentIdx = 0;
        let scores = { "Commander": 0, "Athlete": 0, "Strategist": 0, "Engineer": 0, "Artist": 0, "Explorer": 0 };
        let history = [];
        let currentStage = 0;

        const descs = {
            "Commander": "Interpersonal, Linguistic, and Teaching excellence.",
            "Athlete": "Superior physical movement and kinetic intelligence.",
            "Strategist": "Advanced logical reasoning and problem-solving skills.",
            "Engineer": "Digital proficiency and technical construction ability.",
            "Artist": "Exceptional musical and visual-spatial creativity.",
            "Explorer": "Deep connection to nature, intrapersonal and spiritual wisdom."
        };

        function goToStory(stage) {
            currentStage = stage;
            document.getElementById('intro-image').classList.add('moved');
            document.getElementById('intro-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.add('hidden');
            const storyPage = document.getElementById('story-page');
            storyPage.classList.remove('hidden');
            document.body.style.backgroundImage = backgrounds[`stage${stage}`];
            document.getElementById('story-stage-text').innerText = `Quest Stage ${stage}`;
            document.getElementById('story-text').innerHTML = stageStories[stage];
        }

        function startQuizFromStory() {
            document.getElementById('story-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            createHearts();
            renderQuestion();
        }

        function createHearts() {
            const gauge = document.getElementById('heart-gauge');
            gauge.innerHTML = '';
            for (let i = 0; i < 5; i++) { // 각 스테이지당 5문제 기준
                const s = document.createElement('span');
                s.className = 'heart'; s.innerText = '♥';
                gauge.appendChild(s);
            }
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            if (q.stage !== currentStage) { goToStory(q.stage); return; }
            document.getElementById('quiz-stage-text').innerText = `Quest Stage ${q.stage}`;
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach(opt => {
                const b = document.createElement('button');
                b.className = 'btn'; b.innerText = opt.text;
                b.onclick = () => select(opt.type);
                container.appendChild(b);
            });
            const hearts = document.querySelectorAll('.heart');
            const activeIdx = currentIdx % 5;
            hearts.forEach((h, i) => {
                if (i <= activeIdx) h.classList.add('fill');
                else h.classList.remove('fill');
            });
            document.getElementById('prev-btn').style.visibility = currentIdx > 0 ? 'visible' : 'hidden';
        }

        function select(type) {
            history.push(type);
            scores[type]++;
            currentIdx++;
            if (currentIdx < questions.length) renderQuestion();
            else showResult();
        }

        function goBack() {
            if (currentIdx > 0) {
                currentIdx--;
                const last = history.pop();
                scores[last]--;
                currentStage = questions[currentIdx].stage;
                renderQuestion();
            }
        }

function showResult() {
    // 페이지 전환
    document.getElementById('quiz-page').classList.add('hidden');
    document.getElementById('result-page').classList.remove('hidden');
    
    // 점수 높은 순으로 정렬 (배열 형태)
    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    
    // 1. 상단 순위 박스 렌더링 (디자인을 위해 2위-1위-3위 순서로 배치)
    const container = document.getElementById('rank-container');
    container.innerHTML = `
        <div class="rank-box silver">
            <span class="rank-badge">2nd</span>
            <span class="rank-name">${sorted[1][0]}</span>
        </div>
        <div class="rank-box gold">
            <span class="rank-badge">1st</span>
            <span class="rank-name">${sorted[0][0]}</span>
        </div>
        <div class="rank-box bronze">
            <span class="rank-badge">3rd</span>
            <span class="rank-name">${sorted[2][0]}</span>
        </div>
    `;

    // 2. 하단 상세 설명 리스트 렌더링 (순서대로 1, 2, 3위 표시)
    const descList = document.getElementById('desc-list');
    descList.innerHTML = sorted.slice(0, 3).map((item, i) => `
        <div class="desc-item">
            <b>Rank ${i + 1} - ${item[0]} Ability</b>
            ${descs[item[0]] || "A unique and valuable talent discovered in the wild."}
        </div>
    `).join('');
}
    </script>
</body>
</html>
