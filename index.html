<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Ability Assessment</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        /* 전체 배경 설정 */
        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: #333;
            overflow-x: hidden;

            /* [attachment_0](attachment) 직접 그린 배경 이미지 파일명을 여기에 넣으세요 */
            background-image: url('my_background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* 메인 카드 디자인 */
        .card {
            width: 90%; max-width: 450px;
            padding: 50px 20px; text-align: center; position: relative;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            animation: fadeIn 0.6s ease;
        }

        .hidden { display: none; }

        /* 캐릭터 컨테이너 & 애니메이션 */
        .char-container { width: 180px; margin: 0 auto 20px; animation: floating 3s ease-in-out infinite; }
        .char-container img { width: 100%; height: auto; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.05)); }

        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* 말풍선 디자인 */
        .bubble {
            background: #f9f9f9; padding: 24px; border-radius: 20px; margin-bottom: 30px;
            font-size: 1.1rem; line-height: 1.6; font-weight: 600; color: #222;
            position: relative; border: 1px solid #eee;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }
        .bubble::after {
            content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            border-width: 0 10px 10px; border-style: solid; border-color: transparent transparent #f9f9f9;
        }

        #question-number { font-size: 1rem; font-weight: 800; color: #6C63FF; margin-bottom: 5px; }

        /* 버튼 스타일 */
        .btn {
            display: block; width: 100%; padding: 18px; margin: 12px 0;
            border: 1px solid #e0e0e0; border-radius: 12px; background: #ffffff;
            font-size: 1rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease; color: #444;
        }
        .btn:hover { background: #333; color: #fff; border-color: #333; transform: scale(1.02); }
        .primary-btn { background: #333; color: #fff; border: none; font-weight: 700; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .primary-btn:hover { background: #000; }

        /* 결과 페이지 순위 디자인 */
        .rank-container { display: flex; justify-content: space-around; align-items: flex-end; margin: 35px 0 25px; }
        .rank-box { text-align: center; width: 30%; border-radius: 15px; padding: 15px 5px; background: #fff; border: 2px solid transparent; }
        .rank-badge { display: block; font-size: 0.85rem; font-weight: 800; margin-bottom: 5px; }
        .rank-name { font-weight: 900; font-size: 1.2rem; }

        /* 순위별 색상 (1위: 보라, 2위: 파랑, 3위: 초록) */
        .rank-1 { transform: scale(1.15); border-color: #FFD700; box-shadow: 0 10px 25px rgba(108, 99, 255, 0.2); color: #6C63FF; }
        .rank-1 .rank-badge { color: #856404; }
        .rank-2 { border-color: #C0C0C0; box-shadow: 0 5px 15px rgba(0, 112, 243, 0.1); color: #0070F3; }
        .rank-2 .rank-badge { color: #666; }
        .rank-3 { border-color: #CD7F32; box-shadow: 0 5px 15px rgba(0, 213, 171, 0.1); color: #23D5AB; }
        .rank-3 .rank-badge { color: #8B4513; }

        /* 상세 설명 리스트 */
        .desc-list { text-align: left; margin-top: 30px; background: #fdfdfd; padding: 25px; border-radius: 20px; border: 1px solid #eee; }
        .desc-item { margin-bottom: 18px; font-size: 1rem; line-height: 1.6; color: #555; }
        .desc-item b { font-weight: 700; color: #333; font-size: 1.05rem; display: block; margin-bottom: 3px; }
        .desc-item:nth-child(1) b { color: #6C63FF; }
        .desc-item:nth-child(2) b { color: #0070F3; }
        .desc-item:nth-child(3) b { color: #23D5AB; }
    </style>
</head>
<body>

    <div id="start-page" class="card">
        <div class="char-container">
            <img src="char_main.png" alt="Character">
        </div>
        <div class="bubble">Hi! I'll help you find<br>your hidden abilities.<br>Ready to go?</div>
        <button class="btn primary-btn" onclick="showPage('story-page')">Get Started</button>
    </div>

    <div id="story-page" class="card hidden">
        <div class="char-container">
            <img src="char_story.png" alt="Character">
        </div>
        <div class="bubble">Imagine you are about to<br>start a new adventure.<br>Are you ready for the journey?</div>
        <button class="btn primary-btn" onclick="startQuiz()">Yes, Let's go!</button>
    </div>

    <div id="quiz-page" class="card hidden">
        <div class="char-container">
            <img src="char_quiz.png" alt="Character">
        </div>
        <div id="question-number">Q1 / 10</div>
        <div class="bubble" id="question-text">Question Text</div>
        <div id="options"></div>
        <button id="prev-btn" style="background:none; border:none; color:#bbb; text-decoration:underline; cursor:pointer; margin-top:20px;" onclick="goBack()">Back to Previous</button>
    </div>

    <div id="result-page" class="card hidden">
        <div class="char-container">
            <img src="result_character.png" alt="Character">
        </div>
        <h2 style="margin-bottom: 5px; font-weight: 900;">Assessment Result</h2>
        <p style="color: #777; margin: 0 0 25px; font-size: 0.9rem;">Your Top 3 Strengths</p>
        <div class="rank-container" id="rank-display"></div>
        <div class="desc-list" id="desc-list"></div>
        <button class="btn primary-btn" style="margin-top:30px; font-size: 1.1rem; padding: 20px;" onclick="location.reload()">Retake Test</button>
    </div>

    <script>
        /* 질문 데이터 (내용만 영어로 변경) */
        const questions = [
            { q: "How do you gain energy on weekends?", a: "Chatting with friends", t1: "Communication", b: "Solving puzzles/games", t2: "Analysis", c: "Photography/Gardening", t3: "Nature" },
            { q: "If you were stuck on a desert island?", a: "Build a house/tools", t1: "Practicality", b: "Make an escape plan", t2: "Analysis", c: "Create an SOS sign", t3: "Creativity" },
            { q: "Role in a school festival?", a: "MC/Presenter", t1: "Communication", b: "Designer/Decorator", t2: "Creativity", c: "Running a food booth", t3: "Practicality" },
            { q: "If you were to create an app?", a: "Community/Chatting", t1: "Communication", b: "Data/Algorithms", t2: "Analysis", c: "Beautiful UI/Design", t3: "Creativity" },
            { q: "Found a rare flower?", a: "Search for its name", t1: "Analysis", b: "Draw it in detail", t2: "Creativity", c: "Clear away weeds", t3: "Nature" },
            { q: "How do you make up with a friend?", a: "Heartfelt conversation", t1: "Communication", b: "Analyze the cause", t2: "Analysis", c: "Give a handmade gift", t3: "Practicality" },
            { q: "Favorite movie character type?", a: "Inspirational leader", t1: "Communication", b: "Smart detective", t2: "Analysis", c: "Strong warrior/maker", t3: "Practicality" },
            { q: "What kind of cafe would you open?", a: "Book talk/Lecture cafe", t1: "Communication", b: "Experimental gallery cafe", t2: "Creativity", c: "Garden/Greenhouse cafe", t3: "Nature" },
            { q: "Your secret study method?", a: "Explaining it out loud", t1: "Communication", b: "Making charts/mindmaps", t2: "Analysis", c: "Solving many problems", t3: "Practicality" },
            { q: "Compliment you want to hear?", a: "You're a great listener", t1: "Communication", b: "You're a sharp strategist", t2: "Analysis", c: "You're an amazing creator", t3: "Creativity" }
        ];

        let currentIdx = 0;
        let scores = { "Communication": 0, "Analysis": 0, "Nature": 0, "Practicality": 0, "Creativity": 0 };
        let choiceHistory = [];

        /* 페이지 전환 함수 */
        function showPage(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        /* 퀴즈 시작 함수 */
        function startQuiz() {
            showPage('quiz-page');
            showQuestion();
        }

        /* 질문 출력 함수 */
        function showQuestion() {
            const q = questions[currentIdx];
            document.getElementById('question-number').innerText = `Q${currentIdx + 1} / ${questions.length}`;
            document.getElementById('question-text').innerText = q.q;
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = `
                <button class="btn" onclick="selectOption('${q.t1}')">${q.a}</button>
                <button class="btn" onclick="selectOption('${q.t2}')">${q.b}</button>
                <button class="btn" onclick="selectOption('${q.t3}')">${q.c}</button>
            `;
            document.getElementById('prev-btn').style.display = currentIdx > 0 ? 'inline-block' : 'none';
        }

        /* 선택지 클릭 시 점수 계산 */
        function selectOption(type) {
            choiceHistory.push(type);
            scores[type]++;
            currentIdx++;
            if (currentIdx < questions.length) showQuestion();
            else showResult();
        }

        /* 이전 질문으로 돌아가기 */
        function goBack() {
            if (currentIdx > 0) {
                currentIdx--;
                scores[choiceHistory.pop()]--;
                showQuestion();
            }
        }

        /* 결과 화면 출력 */
        function showResult() {
            showPage('result-page');
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            
            // 상단 순위 박스 생성 (1, 2, 3위)
            const rankDisplay = document.getElementById('rank-display');
            rankDisplay.innerHTML = `
                <div class="rank-box rank-2"><span class="rank-badge">2nd</span><span class="rank-name">${sorted[1][0]}</span></div>
                <div class="rank-box rank-1"><span class="rank-badge">1st</span><span class="rank-name">${sorted[0][0]}</span></div>
                <div class="rank-box rank-3"><span class="rank-badge">3rd</span><span class="rank-name">${sorted[2][0]}</span></div>
            `;

            // 하단 상세 설명 리스트 생성
            const descList = document.getElementById('desc-list');
            descList.innerHTML = sorted.slice(0, 3).map((item, index) => `
                <div class="desc-item">
                    <b>No.${index + 1} ${item[0]}:</b> ${getDescription(item[0])}
                </div>
            `).join('');
        }

        /* 각 능력별 상세 설명 (영어) */
        function getDescription(type) {
            const desc = {
                "Communication": "You have an excellent ability to connect with people and create harmony.",
                "Analysis": "You are a strategist who can see the essence of complex situations logically.",
                "Practicality": "You are a doer who turns ideas into reality with strong action.",
                "Creativity": "You discover new values and express them in ways others can't see.",
                "Nature": "You have deep insight into observing the environment and connecting with life."
            };
            return desc[type];
        }
    </script>
</body>
</html>
