<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adventure Ability Assessment</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100dvh; color: #333;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            transition: background-image 1.2s ease-in-out; position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: inherit; background-size: cover; background-position: center; z-index: -1;
        }

        /* 인트로 지도 */
        #intro-image {
            position: fixed; top: 25%; left: 50%; transform: translate(-50%, -50%);
            width: 440px; max-width: 85vw; height: auto; z-index: 5;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55); pointer-events: none;
        }
        #intro-image.moved {
            top: 60px; left: calc(100% - 40px); transform: translate(-100%, 0);
            width: 300px; z-index: 100; opacity: 0.9;
        }

        #intro-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: transparent; z-index: 10;
        }

        .card {
            width: 92%; max-width: 500px; padding: 35px 20px; text-align: center;
            background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(10px);
            border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); box-sizing: border-box; z-index: 20;
        }
        .hidden { display: none !important; }

        .intro-title {
            font-family: 'Dancing Script', cursive; font-size: 5rem; margin: 220px 0 0 0;
            color: #2c3e50; text-shadow: 0 2px 15px rgba(255,255,255,1);
        }
        .intro-desc { 
            font-size: 1.2rem; font-weight: 800; margin: 20px 0 40px 0; color: #333; 
            line-height: 1.6; word-break: keep-all; max-width: 85%;
        }
        
        .start-btn {
            width: 280px; padding: 22px; border: none; border-radius: 20px;
            background: #333; color: #fff; font-size: 1.4rem; font-weight: 700;
            cursor: pointer; transition: 0.3s; margin-top: 20px;
        }

        .char-container { width: 120px; margin: 0 auto 10px; animation: floating 3s ease-in-out infinite; }
        .char-container img { width: 100%; }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .bubble {
            background: #fff; padding: 20px; border-radius: 25px; margin-top: 10px; margin-bottom: 25px;
            font-size: 1.05rem; line-height: 1.5; font-weight: 700; border: 3px solid #333;
            position: relative; word-break: keep-all;
        }
        .bubble::before {
            content: ''; position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            border-width: 0 15px 15px; border-style: solid; border-color: transparent transparent #333;
        }

           /* 기본 버튼 설정 */
        .btn {
            display: block; width: 100%; padding: 16px; margin: 10px 0;
            border: 1px solid #ddd; border-radius: 15px; background: #fff;
            
            /* 아이패드 파란 글씨 방지 및 검정색 고정 */
            color: #333 !important; 
            -webkit-text-fill-color: #333 !important;
            
            font-size: 1rem; font-weight: 600; cursor: pointer; text-align: left;
            transition: background 0.1s, color 0.1s; /* 반짝이는 효과를 위한 짧은 트랜지션 */
            
            /* 터치 시 회색 반짝임 제거 (커스텀 반짝임 사용 예정) */
            -webkit-tap-highlight-color: transparent; 
        }

        /* [노트북] 일반 선택지 버튼: 마우스 호버 효과 */
        @media (hover: hover) {
            .btn:not(.btn-continue):hover { 
                background: #333 !important; 
                color: #fff !important; 
                -webkit-text-fill-color: #fff !important;
            }
        }

        /* [아이패드] 일반 선택지 버튼: 터치 시 반짝이는 효과 */
        .btn:not(.btn-continue):active {
            background: #333 !important; /* 터치하는 순간 배경색 변경 */
            color: #fff !important;      /* 터치하는 순간 글자색 변경 */
            -webkit-text-fill-color: #fff !important;
            transition: background 0s, color 0s; /* 터치 시 즉각적인 반응 */
        }

        /* Continue Quest 전용: 항상 검정 배경/흰 글씨 고정, 효과 없음 */
        .btn-continue {
            background: #333 !important;
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
            text-align: center !important;
            cursor: default;
        }

        /* Continue Quest 버튼은 터치 시에도 아무 변화 없도록 설정 */
        .btn-continue:active {
            background: #333 !important;
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
        }


        .rank-wrapper { display: flex; align-items: flex-end; justify-content: center; gap: 8px; margin: 20px 0; }
        .rank-box { flex: 1; padding: 10px 5px; border-radius: 12px; background: #fff; border-width: 2.5px; border-style: solid; }
        .rank-box.gold { height: 100px; border-color: #f1c40f; order: 2; }
        .rank-box.silver { height: 85px; border-color: #bdc3c7; order: 1; }
        .rank-box.bronze { height: 80px; border-color: #e67e22; order: 3; }
        .rank-box b { display: block; font-size: 1rem; margin-top: 5px; }
        .rank-box span { font-size: 0.7rem; font-weight: 800; color: #999; }

        .desc-area { text-align: left; background: #fdfdfd; padding: 18px; border-radius: 20px; font-size: 0.85rem; border: 1px solid #eee; }
        .desc-area p { margin: 8px 0; line-height: 1.4; color: #444; }

        .heart-gauge { display: flex; justify-content: center; gap: 4px; margin-top: 15px; font-size: 1.2rem; color: #eee; }
        .heart.fill { color: #e74c3c; }
        .stage-indicator { font-weight: 900; color: #aaa; font-size: 0.8rem; margin-bottom: 5px; text-transform: uppercase; }
    </style>
</head>
<body>

    <img src="jido.png" id="intro-image" alt="Intro Map">

    <div id="intro-page">
        <h2 class="intro-title">Welcome!</h2>
        <p class="intro-desc">
            Embark on a legendary quest to uncover the hidden powers within you. 
            Navigate through mysterious islands, scorching deserts, and deep jungles. 
            Every choice you make defines your true potential. 
            Are you ready to face the challenges and find your destiny?
        </p>
        <button class="start-btn" onclick="goToStory(1)">Start Journey</button>
    </div>

	<div id="story-page" class="card hidden">
    <div class="stage-indicator" id="story-stage-text">Stage 1</div>
    <div class="char-container"><img src="cha.png" alt="Character"></div>
    <div class="bubble" id="story-text"></div>
    <button class="btn btn-continue" onclick="startQuizFromStory()">Continue Quest</button>
	</div>

    <div id="quiz-page" class="card hidden">
        <div class="stage-indicator" id="quiz-stage-text">Stage 1</div>
        <div class="char-container"><img src="cha.png" alt="Character"></div>
        <div class="bubble" id="question-text"></div>
        <div id="options-container"></div>
        <div class="heart-gauge" id="heart-gauge"></div>
        <button id="prev-btn" style="background:none; border:none; color:#999; text-decoration:underline; cursor:pointer; margin-top:10px; font-weight:700;" onclick="goBack()">Back</button>
    </div>

    <div id="result-page" class="card hidden">
        <h2 style="font-weight: 900; font-size: 1.6rem; margin-bottom: 10px;">Assessment Result</h2>
        <div class="char-container"><img src="result_character.png" alt="Character"></div>
        <div class="rank-wrapper" id="rank-container"></div>
        <div class="desc-area" id="desc-list"></div>
        <button class="start-btn" style="width:100%; margin-top:25px;" onclick="location.reload()">Retake Journey</button>
    </div>

    <script>
        const backgrounds = { stage1: "url('samak.png')", stage2: "url('desert_bg.png')", stage3: "url('jungle_bg.png')" };
        const stageStories = {
            1: "🏝️ Stage 1: The Deserted Island (Quest 1-5)",
            2: "🏜️ Stage 2: The Hot Desert (Quest 6-10)",
            3: "🌿 Stage 3: The Deep Jungle (Quest 11-15)"
        };

        const questions = [
            // Stage 1
            { stage: 1, q: "\"First step on the beach! What’s the plan?\"", options: [{text: "Let's look for people and get help!", type: "Leader"}, {text: "I'll find a sharp stone to make a tool.", type: "Maker"}, {text: "I'll stay calm and think of a plan.", type: "Strategist"}]},
            { stage: 1, q: "\"I'm so thirsty... How do we get water?\"", options: [{text: "I’ll climb that tree for coconuts!", type: "Athlete"}, {text: "I'll build a system to catch rain.", type: "Maker"}, {text: "I'll find a way to make the sea water drinkable.", type: "Strategist"}]},
            { stage: 1, q: "\"Look! An old map in the sand. What do you think?\"", options: [{text: "I'll solve the hidden puzzles on it.", type: "Strategist"}, {text: "I wonder why this map was left here...", type: "Philosopher"}, {text: "Let me redraw it to show the island's shape!", type: "Artist"}]},
            { stage: 1, q: "\"Something is moving in the bushes! What now?\"", options: [{text: "Grab a heavy stick! We need to defend ourselves.", type: "Maker"}, {text: "Quick! Let's run as fast as we can!", type: "Athlete"}, {text: "Don't move! Let's see what it is before we act.", type: "Leader"}]},
            { stage: 1, q: "\"A plane! How do we show them we are here?\"", options: [{text: "I'll make a giant 'HELP' sign with shells.", type: "Artist"}, {text: "I'll start a big fire with lots of smoke.", type: "Maker"}, {text: "Everyone! Wave your clothes together!", type: "Leader"}]},
            // Stage 2
            { stage: 2, q: "\"It’s so hot... Can you help me with these water bags?\"", options: [{text: "No problem! Give the heaviest ones to me.", type: "Athlete"}, {text: "Let’s find the shortest route to save energy.", type: "Strategist"}, {text: "I’ll tie them together to carry them easily.", type: "Maker"}]},
            { stage: 2, q: "\"The sun is melting me! How do we stay cool?\"", options: [{text: "That spot under the trees looks so much cooler!", type: "Artist"}, {text: "Let's take a break in the shade. Safety first!", type: "Leader"}, {text: "I'll only walk in the shadows of the rocks.", type: "Strategist"}]},
            { stage: 2, q: "\"Whoa... a Pyramid! What's the first thing you notice?\"", options: [{text: "How did they build this without machines?", type: "Maker"}, {text: "It’s way more massive in person! The scale is unreal.", type: "Artist"}, {text: "What kind of secret symbols are on the walls?", type: "Philosopher"}]},
            { stage: 2, q: "\"There's a traveler over there. Should we talk to him?\"", options: [{text: "Let's talk to him. He might help us out!", type: "Leader"}, {text: "Wait, stay back. He might be dangerous.", type: "Philosopher"}, {text: "I wonder how long he's been out here alone...", type: "Artist"}]},
            { stage: 2, q: "\"The desert sky is so clear. What are you doing right now?\"", options: [{text: "I'll take a photo of these stars. Perfect shot!", type: "Artist"}, {text: "I'll use the stars to plan our route for tomorrow.", type: "Strategist"}, {text: "I'll just watch the stars and think about home.", type: "Philosopher"}]},
            // Stage 3
            { stage: 3, q: "\"It's like a green maze. How do we move?\"", options: [{text: "I’ll lead the way and clear the path.", type: "Athlete"}, {text: "Check the compass. Stick to the heading.", type: "Strategist"}, {text: "I'll use the sun and moss for direction.", type: "Leader"}]},
            { stage: 3, q: "\"Crap, a monkey swiped our bag! What's the move?\"", options: [{text: "I'll chase it and get our bag back!", type: "Athlete"}, {text: "Let's distract it with some fruit first.", type: "Leader"}, {text: "It’s just a bag. Let it go. Safety is more important.", type: "Philosopher"}]},
            { stage: 3, q: "\"The villagers look suspicious. Now what?\"", options: [{text: "Hands up, walk slow. Show we’re friendly.", type: "Leader"}, {text: "Wait and watch. See how they react first.", type: "Philosopher"}, {text: "I'll use hand gestures and vibe with them.", type: "Artist"}]},
            { stage: 3, q: "\"The villagers are having a festival! Your move?\"", options: [{text: "I’m hitting the center and dancing!", type: "Artist"}, {text: "I’ll just chill and listen to the music.", type: "Philosopher"}, {text: "I’ll help them with the heavy lifting or tasks.", type: "Athlete"}]},
            { stage: 3, q: "\"We finally made it out! What was the best part?\"", options: [{text: "Our teamwork. We crushed it together!", type: "Leader"}, {text: "The views. That jungle was insane.", type: "Artist"}, {text: "That was a tough workout! I feel much stronger now.", type: "Athlete"}]}
        ];

        let currentIdx = 0;
        let scores = { "Leader": 0, "Maker": 0, "Strategist": 0, "Athlete": 0, "Philosopher": 0, "Artist": 0 };
        let history = [];
        let currentStage = 0;

        const descs = {
            "Leader": "Natural-born commander who inspires and unifies the team.",
            "Strategist": "Sharp thinker who finds the most efficient path to success.",
            "Athlete": "Powerhouse with endless energy and physical resilience.",
            "Maker": "Skilled creator who can build anything from scratch.",
            "Artist": "Creative visionary who finds beauty and expression everywhere.",
            "Philosopher": "Deep thinker who explores the meaning and wisdom of life."
        };

        function goToStory(stage) {
            currentStage = stage;
            document.getElementById('intro-image').classList.add('moved');
            document.getElementById('intro-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.add('hidden');
            const storyPage = document.getElementById('story-page');
            storyPage.classList.remove('hidden');
            document.body.style.backgroundImage = backgrounds[`stage${stage}`];
            document.getElementById('story-stage-text').innerText = `Quest Stage ${stage}`;
            document.getElementById('story-text').innerHTML = stageStories[stage];
        }

        function startQuizFromStory() {
            document.getElementById('story-page').classList.add('hidden');
            document.getElementById('quiz-page').classList.remove('hidden');
            createHearts();
            renderQuestion();
        }

        function createHearts() {
            const gauge = document.getElementById('heart-gauge');
            gauge.innerHTML = '';
            for (let i = 0; i < 5; i++) { // 각 스테이지당 5문제 기준
                const s = document.createElement('span');
                s.className = 'heart'; s.innerText = '♥';
                gauge.appendChild(s);
            }
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            if (q.stage !== currentStage) { goToStory(q.stage); return; }
            document.getElementById('quiz-stage-text').innerText = `Quest Stage ${q.stage}`;
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach(opt => {
                const b = document.createElement('button');
                b.className = 'btn'; b.innerText = opt.text;
                b.onclick = () => select(opt.type);
                container.appendChild(b);
            });
            const hearts = document.querySelectorAll('.heart');
            const activeIdx = currentIdx % 5;
            hearts.forEach((h, i) => {
                if (i <= activeIdx) h.classList.add('fill');
                else h.classList.remove('fill');
            });
            document.getElementById('prev-btn').style.visibility = currentIdx > 0 ? 'visible' : 'hidden';
        }

        function select(type) {
            history.push(type);
            scores[type]++;
            currentIdx++;
            if (currentIdx < questions.length) renderQuestion();
            else showResult();
        }

        function goBack() {
            if (currentIdx > 0) {
                currentIdx--;
                const last = history.pop();
                scores[last]--;
                currentStage = questions[currentIdx].stage;
                renderQuestion();
            }
        }

        function showResult() {
            document.getElementById('quiz-page').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
            const container = document.getElementById('rank-container');
            container.innerHTML = `
                <div class="rank-box silver"><span>2nd</span><b>${sorted[1][0]}</b></div>
                <div class="rank-box gold"><span>1st</span><b>${sorted[0][0]}</b></div>
                <div class="rank-box bronze"><span>3rd</span><b>${sorted[2][0]}</b></div>
            `;
            document.getElementById('desc-list').innerHTML = sorted.slice(0, 3).map((item, i) => `
                <p><b>No.${i+1} ${item[0]}:</b> ${descs[item[0]] || "A unique and valuable talent discovered in the wild."}</p>
            `).join('');
        }
    </script>
</body>
</html>
