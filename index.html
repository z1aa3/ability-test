<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Ability Assessment</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap');

        /* 아이패드/모바일 배경 잘림 방지 설정 */
        html, body {
            margin: 0; padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 인트로에서 스크롤 방지 */
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100dvh; /* 최신 모바일 브라우저 높이 대응 */
            color: #333;
            background-image: url('samak.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: scroll; /* 모바일 성능 및 고정을 위해 변경 */
            position: relative;
        }

        /* 배경 보정용 가상 요소 (아이패드에서 배경이 밀리는 현상 방지) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: inherit;
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* 인트로 지도 */
        #intro-image {
            position: fixed;
            top: 25%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 440px;
            max-width: 80vw; /* 모바일/아이패드에서 너무 크지 않게 */
            height: auto;
            z-index: 5;
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            pointer-events: none;
        }

        /* 이동 후 위치 */
        #intro-image.moved {
            top: 20px;
            left: calc(100% - 30px); /* 패딩 조정 */
            transform: translate(-100%, 0);
            width: 180px; /* 이동 후 크기 살짝 줄임 */
            z-index: 100;
        }

        /* 인트로 페이지 컨테이너 */
        #intro-page {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100dvh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: transparent;
            z-index: 10;
        }

        .card {
            width: 90%; max-width: 450px;
            padding: 40px 15px; text-align: center; position: relative;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            box-sizing: border-box;
            z-index: 20;
        }

        .hidden { display: none !important; }

        /* 타이틀 및 설명 */
        .intro-title {
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem; /* 조금 더 최적화 */
            font-weight: 700;
            margin: 0;
            margin-top: 150px;
            color: #2c3e50;
            text-shadow: 0 2px 15px rgba(255,255,255,0.9);
        }

        .intro-desc {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.4;
            margin: 20px 0 40px 0;
            color: #333;
            text-align: center;
            word-break: keep-all;
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }

        .start-btn {
            max-width: 300px;
            width: 80%;
            padding: 20px;
            border: none;
            border-radius: 15px;
            background: #333;
            color: #fff;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* 기타 캐릭터 및 버튼 스타일 유지 */
        .char-container { width: 140px; margin: 0 auto 20px; animation: floating 3s ease-in-out infinite; }
        .char-container img { width: 100%; height: auto; }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        .bubble {
            background: #f9f9f9; padding: 20px; border-radius: 20px; margin-bottom: 25px;
            font-size: 1rem; line-height: 1.5; font-weight: 600; color: #222;
            position: relative; border: 2px solid #333;
        }
        .btn {
            display: block; width: 100%; padding: 18px; margin: 10px 0;
            border: 1px solid #e0e0e0; border-radius: 12px; background: #ffffff;
            font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .heart-gauge { display: flex; justify-content: center; gap: 5px; margin: 15px 0; font-size: 1.2rem; color: #ddd; }
        .heart.fill { color: #e74c3c; }
    </style>
</head>
<body>

    <img src="jido.png" id="intro-image" alt="Intro Photo">

    <div id="intro-page">
        <h2 class="intro-title">Welcome!</h2>
        <p class="intro-desc">
            This is a space to discover your unique talents.<br>
            Are you ready to find your true potential?
        </p>
        <button class="start-btn" onclick="goToStart()">Start Journey</button>
    </div>

    <div id="start-page" class="card hidden">
        <div class="char-container"><img src="cha.png" alt="Character"></div>
        <div class="bubble">Hi! I'll help you find<br>your hidden abilities.</div>
        <button class="btn" style="background:#333; color:#fff;" onclick="showPage('story-page')">Next</button>
    </div>

    <div id="story-page" class="card hidden">
        <div class="char-container"><img src="cha.png" alt="Character"></div>
        <div class="bubble">Imagine you are about to<br>start a new adventure.</div>
        <button class="btn" style="background:#333; color:#fff;" onclick="startQuiz()">Yes, Let's go!</button>
    </div>

    <div id="quiz-page" class="card hidden">
        <div class="char-container"><img src="char_quiz.png" alt="Character"></div>
        <div class="bubble" id="question-text">Loading...</div>
        <div id="options-container"></div>
        <div class="heart-gauge" id="heart-gauge"></div>
        <button id="prev-btn" style="background:none; border:none; color:#bbb; text-decoration:underline; cursor:pointer; margin-top:10px;" onclick="goBack()">Back</button>
    </div>

    <div id="result-page" class="card hidden">
        <div class="char-container"><img src="result_character.png" alt="Character"></div>
        <h2 style="font-weight: 900;">Assessment Result</h2>
        <div id="rank-display" style="display:flex; gap:10px; margin:20px 0;"></div>
        <div id="desc-list" style="text-align:left; font-size:0.9rem; background:#f9f9f9; padding:15px; border-radius:15px;"></div>
        <button class="btn" style="margin-top:20px; background:#333; color:#fff;" onclick="location.reload()">Retake</button>
    </div>

    <script>
        function goToStart() {
            const img = document.getElementById('intro-image');
            img.classList.add('moved');
            document.getElementById('intro-page').classList.add('hidden');
            showPage('start-page');
            document.body.style.overflow = 'auto';
        }

        function showPage(id) {
            document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
            const target = document.getElementById(id);
            if(target) target.classList.remove('hidden');
        }

        // 퀴즈 로직 (질문 생략 - 기존과 동일하게 유지)
        const questions = [
            { q: "How do you gain energy on weekends?", options: [ {text: "Chatting with friends", type: "Communication"}, {text: "Solving puzzles", type: "Analysis"}, {text: "Gardening", type: "Nature"} ] },
            { q: "If you were stuck on a desert island?", options: [ {text: "Build a house", type: "Practicality"}, {text: "Make an escape plan", type: "Analysis"}, {text: "Create an SOS sign", type: "Creativity"} ] },
            { q: "Role in a school festival?", options: [ {text: "MC/Presenter", type: "Communication"}, {text: "Designer", type: "Creativity"}, {text: "Food booth", type: "Practicality"} ] },
            { q: "If you were to create an app?", options: [ {text: "Chatting app", type: "Communication"}, {text: "Data/Algorithms", type: "Analysis"}, {text: "Beautiful Design", type: "Creativity"} ] },
            { q: "Found a rare flower?", options: [ {text: "Search for its name", type: "Analysis"}, {text: "Draw it in detail", type: "Creativity"}, {text: "Clear away weeds", type: "Nature"} ] },
            { q: "How do you make up with a friend?", options: [ {text: "Heartfelt conversation", type: "Communication"}, {text: "Analyze the cause", type: "Analysis"}, {text: "Give a handmade gift", type: "Practicality"} ] },
            { q: "Favorite movie character type?", options: [ {text: "Inspirational leader", type: "Communication"}, {text: "Smart detective", type: "Analysis"}, {text: "Strong maker", type: "Practicality"} ] },
            { q: "What kind of cafe would you open?", options: [ {text: "Lecture cafe", type: "Communication"}, {text: "Gallery cafe", type: "Creativity"}, {text: "Garden cafe", type: "Nature"} ] },
            { q: "Your secret study method?", options: [ {text: "Explaining out loud", type: "Communication"}, {text: "Making mindmaps", type: "Analysis"}, {text: "Solving problems", type: "Practicality"} ] },
            { q: "Compliment you want to hear?", options: [ {text: "Great listener", type: "Communication"}, {text: "Sharp strategist", type: "Analysis"}, {text: "Amazing creator", type: "Creativity"} ] }
        ];

        let currentIdx = 0;
        let scores = { "Communication": 0, "Analysis": 0, "Nature": 0, "Practicality": 0, "Creativity": 0 };
        let choiceHistory = [];

        function startQuiz() {
            currentIdx = 0;
            scores = { "Communication": 0, "Analysis": 0, "Nature": 0, "Practicality": 0, "Creativity": 0 };
            choiceHistory = [];
            showPage('quiz-page');
            createHearts();
            renderQuestion();
        }

        function createHearts() {
            const gauge = document.getElementById('heart-gauge');
            gauge.innerHTML = '';
            for (let i = 0; i < questions.length; i++) {
                const span = document.createElement('span');
                span.className = 'heart';
                span.innerText = '♥';
                gauge.appendChild(span);
            }
        }

        function renderQuestion() {
            const qData = questions[currentIdx];
            document.getElementById('question-text').innerText = qData.q;
            const optionsBox = document.getElementById('options-container');
            optionsBox.innerHTML = '';
            qData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.type);
                optionsBox.appendChild(btn);
            });
            updateHearts();
            document.getElementById('prev-btn').style.display = currentIdx > 0 ? 'inline-block' : 'none';
        }

        function selectOption(type) {
            choiceHistory.push(type);
            scores[type]++;
            currentIdx++;
            if (currentIdx < questions.length) renderQuestion();
            else showResult();
        }

        function updateHearts() {
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach((h, i) => {
                if (i < currentIdx) h.classList.add('fill');
                else h.classList.remove('fill');
            });
        }

        function goBack() {
            if (currentIdx > 0) {
                currentIdx--;
                const lastType = choiceHistory.pop();
                scores[lastType]--;
                renderQuestion();
            }
        }

        function showResult() {
            showPage('result-page');
            const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
            document.getElementById('rank-display').innerHTML = sorted.slice(0, 3).map((item, idx) => `
                <div style="flex:1; border:1px solid #ddd; border-radius:10px; padding:10px; background:#fff;">
                    <span style="font-size:0.7rem;">${idx+1}st</span><br><b>${item[0]}</b>
                </div>
            `).join('');
            document.getElementById('desc-list').innerHTML = sorted.slice(0, 3).map((item, idx) => `
                <p><b>${item[0]}:</b> ${getDescription(item[0])}</p>
            `).join('');
        }

        function getDescription(type) {
            const desc = {
                "Communication": "Excellent at connecting with people.",
                "Analysis": "A sharp strategist.",
                "Practicality": "A doer who makes things happen.",
                "Creativity": "Uniquely expressive.",
                "Nature": "Deep insight into the world."
            };
            return desc[type];
        }
    </script>
</body>
</html>
